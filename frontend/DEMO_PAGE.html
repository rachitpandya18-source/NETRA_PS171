<!doctype html>
<html><head><meta charset="utf-8"><title>NETRA Secure Form Demo</title>
<style>body{font-family:Arial;background:#eef3f8;padding:50px}.box{max-width:520px;margin:auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0002}label{display:block;margin:15px 0 6px}input,button{width:100%;padding:12px;border-radius:8px;border:1px solid #bbc8d6}button{margin-top:18px;background:#1769e0;color:white;font-weight:bold;border:0}.note{color:#607080;font-size:13px}</style></head>
<body><div class="box"><h1>Citizen Service — Secure Form</h1><p class="note">NETRA demo page. The email is present only in the browser.</p>
<label for="name">Full Name</label><input id="name" name="name" value="Rudresh Joshi" aria-label="Full Name">
<label for="email">Email Address</label><input id="email" name="email" value="demo.user@example.com" aria-label="Email Address">
<label for="phone">Mobile Number</label><input id="phone" name="phone" value="+91 9876543210" aria-label="Mobile Number">
<button id="submit">Submit Application</button></div></body></html>
